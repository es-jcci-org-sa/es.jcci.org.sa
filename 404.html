<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Error 404</title>
  <style>
    html,body{margin:0;width:100%;height:100%;min-height:100%;background:#fff;overflow:hidden}
    body{font-family:Arial,Helvetica,sans-serif;color:#111}
    #route-viewer{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
    #error404{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;text-align:center}
    #error404 h1{margin:0 0 8px;font-size:32px;line-height:1.15;font-weight:700}
    #error404 p{margin:0;font-size:14px;line-height:1.4;font-weight:400;color:#444}
  </style>
</head>
<body>
  <main id="error404" role="main"><div><h1>Error 404</h1><p>Page not found.</p></div></main>
  <iframe id="route-viewer" title="Document viewer"></iframe>
  <script>
  (function () {
    'use strict';

    var marker = '/files-portal/';
    var path;
    try { path = decodeURIComponent(location.pathname || ''); }
    catch (_) { path = location.pathname || ''; }

    var at = path.indexOf(marker);
    if (at < 0) return; // domain/root or unrelated path => keep Error 404

    // The exact token present in the public URL is the only token we pass onward.
    // No routes lookup, no default token, no fallback record here.
    var token = path.slice(at + marker.length).replace(/^\/+|\/+$/g, '');
    if (!token || token.indexOf('/') !== -1 || /^(?:viewer|index)\.html$/i.test(token)) return;

    var deploymentBase = path.slice(0, at).replace(/\/+$/, '');
    var root = (deploymentBase || '') + '/';
    function url(rel) {
      return root.replace(/\/$/, '') + '/' + String(rel || '').replace(/^\/+/, '');
    }

    var frame = document.getElementById('route-viewer');
    var err = document.getElementById('error404');

    function show404() {
      document.title = 'Error 404';
      if (frame) {
        frame.style.display = 'none';
        try { frame.src = 'about:blank'; } catch (_) {}
      }
      if (err) err.style.display = 'flex';
    }

    // Start the viewer for every syntactically valid token. The viewer/router is the
    // single source of truth that checks routes.json + the mapped JSON/PDF files.
    // This prevents a valid new token from being rejected by a second, stale check here.
    if (err) err.style.display = 'none';
    frame.style.display = 'block';
    frame.src = url('files-portal/viewer.html') + '?__route=' + encodeURIComponent(token);
    document.title = '';

    // If the exact token is not mapped, or its mapped files are missing, the inner
    // router reports DOCUMENT_NOT_FOUND and only then do we show the public 404 page.
    window.addEventListener('message', function (ev) {
      if (ev.origin !== location.origin) return;
      if (ev.data && ev.data.type === 'DOCUMENT_NOT_FOUND') show404();
    });
  })();
  </script>
</body>
</html>
